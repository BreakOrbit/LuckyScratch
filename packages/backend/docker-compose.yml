name: lucky-scratch-backend

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_HOST: 0.0.0.0
  API_PORT: ${API_PORT:-8080}
  API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8080}
  CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-false}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your existing PostgreSQL instance}
  RPC_URL: ${RPC_URL:-http://host.docker.internal:8545}
  CHAIN_ID: ${CHAIN_ID:-31337}
  CHAIN_NAME: ${CHAIN_NAME:-hardhat}
  AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
  AUTO_IMPORT_DEPLOYMENTS: ${AUTO_IMPORT_DEPLOYMENTS:-true}
  MIGRATIONS_DIR: /app/sql/migrations
  DEPLOYMENTS_DIR: /app/deployments
  ADMIN_TOKEN: ${ADMIN_TOKEN:-}
  REVEAL_SUBMIT_TIMEOUT: ${REVEAL_SUBMIT_TIMEOUT:-2m}
  JOB_LOCK_TIMEOUT: ${JOB_LOCK_TIMEOUT:-5m}
  IPFS_PROVIDER: ${IPFS_PROVIDER:-pinata}
  IPFS_GATEWAY_BASE_URL: ${IPFS_GATEWAY_BASE_URL:-https://gateway.pinata.cloud/ipfs}
  IPFS_PINATA_JWT: ${IPFS_PINATA_JWT:-}
  IPFS_PINATA_API_BASE_URL: ${IPFS_PINATA_API_BASE_URL:-https://api.pinata.cloud}
  IPFS_KUBO_API_URL: ${IPFS_KUBO_API_URL:-http://host.docker.internal:5001}
  IPFS_UPLOAD_MAX_BYTES: ${IPFS_UPLOAD_MAX_BYTES:-10485760}
  POOL_DRAFT_TTL: ${POOL_DRAFT_TTL:-24h}
  ZAMA_MODE: ${ZAMA_MODE:-}
  ZAMA_RELAYER_URL: ${ZAMA_RELAYER_URL:-}
  ZAMA_API_KEY: ${ZAMA_API_KEY:-}
  ZAMA_HTTP_TIMEOUT: ${ZAMA_HTTP_TIMEOUT:-30s}

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: *backend-environment
  volumes:
    - ../hardhat/deployments:/app/deployments:ro

services:
  backend-api:
    <<: *backend-service
    command: ["api"]
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"

  backend-worker:
    <<: *backend-service
    command: ["worker"]
